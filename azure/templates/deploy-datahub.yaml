jobs:
  - deployment: Deploy
    displayName: Deploy Datahub
    environment: $(kubernetesEnvironment)
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self

            - task: HelmDeploy@0
              displayName: Add Datahub Helm Repo
              inputs:
                command: repo
                arguments: add datahub https://helm.datahubproject.io/
                namespace: $(kubernetesNamespace)

            - script: |
              displayName: Inspect env with indices
                kubectl -n $(kubernetesNamespace) get deploy datahub-datahub-frontend \
                  -o jsonpath='{range $i,$e:=.spec.template.spec.containers[0].env}{printf "[%d] %s " $i $e.name}{if $e.value}{printf "= %s" $e.value}{end}{if $e.valueFrom.secretKeyRef.name}{printf " <- secret:%s key:%s" $e.valueFrom.secretKeyRef.name $e.valueFrom.secretKeyRef.key}{end}{"\n"}{end}'


            - task: HelmDeploy@0
              displayName: Helm deploy Datahub dev
              condition: eq(variables.environment, 'dev')
              inputs:
                command: upgrade
                chartType: Name
                chartName: datahub/datahub
                chartVersion: 0.7.0
                releaseName: datahub
                valueFile: helm/values.yaml
                namespace: $(kubernetesNamespace)
                arguments: >
                  --timeout 1h
                  --values helm/values-override-dev-stg.yaml
                  --set datahub-frontend.ingress.hosts[0].host="$(ingressHost)"
                  --set datahub-frontend.oidcAuthentication.clientId="$(azureClientIdDev)"
                  --set datahub-frontend.oidcAuthentication.azureTenantId="$(azureTenantIdDev)"
                  --set datahub-frontend.oidcAuthentication.clientSecret="$(azureClientSecretDev)"

            - task: HelmDeploy@0
              displayName: Helm deploy Datahub stg
              condition: eq(variables.environment, 'stg')
              inputs:
                command: upgrade
                chartType: Name
                chartName: datahub/datahub
                chartVersion: 0.7.0
                releaseName: datahub
                valueFile: helm/values.yaml
                namespace: $(kubernetesNamespace)
                arguments: >
                  --timeout 1h
                  --values helm/values-override-dev-stg.yaml
                  --values helm/values-override-stg-prd.yaml
                  --set datahub-frontend.ingress.hosts[0].host="$(ingressHost)"
                  --set datahub-frontend.oidcAuthentication.clientSecretRef.secretRef="oi-datahub-secrets-$(deployEnv)"
                  --set datahub-frontend.oidcAuthentication.azureTenantId="$(azureTenantId)"
                  --set datahub-frontend.extraEnvs[0].valueFrom.secretKeyRef.name="oi-datahub-secrets-$(deployEnv)"

            - task: HelmDeploy@0
              displayName: Helm deploy Datahub prd
              condition: eq(variables.environment, 'prd')
              inputs:
                command: upgrade
                chartType: Name
                chartName: datahub/datahub
                chartVersion: 0.6.0
                releaseName: datahub
                valueFile: helm/values.yaml
                namespace: $(kubernetesNamespace)
                arguments: >
                  --timeout 1h
                  --values helm/values-override-prd.yaml
                  --values helm/values-override-stg-prd.yaml
                  --set datahub-frontend.ingress.hosts[0].host="$(ingressHost)"
                  --set datahub-frontend.oidcAuthentication.clientSecretRef.secretRef="oi-datahub-secrets-$(deployEnv)"
                  --set datahub-frontend.oidcAuthentication.azureTenantId="$(azureTenantId)"
                  --set datahub-frontend.extraEnvs[0].valueFrom.secretKeyRef.name="oi-datahub-secrets-$(deployEnv)"

            - task: Kubernetes@1
              displayName: Force restart deployments
              inputs:
                namespace: $(kubernetesNamespace)
                command: rollout
                arguments: restart deploy datahub-datahub-frontend datahub-datahub-gms
