elasticsearch:
  enabled: true
  replicas: 3
  minimumMasterNodes: 1
  antiAffinity: null
  clusterHealthCheckParams: null
  maxUnavailable: ""  # Explicitly set maxUnavailable to ensure only one PDB parameter is set
  minAvailable: null # Explicitly set maxUnavailable to ensure only one PDB parameter is set

  # # Shrink default JVM heap.
  esJavaOpts: "-Xmx1500M -Xms1500M"

  # # Allocate smaller chunks of memory per pod.
  resources:
    # Set memory to be double the JVM heap
    # The other half will be taken up by Lucene
    requests:
      cpu: "300m"
      memory: "3G"
    limits:
      cpu: "1000m"
      memory: "3G"
